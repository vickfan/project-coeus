version: '3.8'

services:
  coeus-bot:
    build: .
    container_name: coeus-bot-local
    restart: unless-stopped
    environment:
      - COEUS_USERNAME=${COEUS_USERNAME}
      - COEUS_NOTES_TOKEN=${COEUS_NOTES_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - COEUS_NOTES_REPO=${COEUS_NOTES_REPO}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./src:/app/src
      - ./notes:/app/notes