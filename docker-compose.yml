version: '3.8'

services:
  coeus-bot:
    build: .
    container_name: coeus-bot-local
    restart: unless-stopped
    environment:
      - COEUS_USERNAME=${COEUS_USERNAME}
      - COEUS_NOTES_TOKEN=${COEUS_NOTES_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - COEUS_NOTES_REPO=${COEUS_NOTES_REPO}
      - NODE_ENV=${NODE_ENV}
      - LLM_PROVIDER=${LLM_PROVIDER:-cloudflare}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_AI_MODEL=${CLOUDFLARE_AI_MODEL:-@cf/meta/llama-3.2-3b-instruct}
    volumes:
      - ./src:/app/src
      - ./notes:/app/notes
